[project]
name = "shipq"
version = "0.1.0"
description = "Compare parcel shipping quotes across courier aggregators from the terminal"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jean Galea" }]
dependencies = [
    "curl-cffi>=0.13",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
shipq = "shipq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shipq"]
